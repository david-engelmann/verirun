name: ci

# Gate design for verirun.
# Every pull request, merge group, and push to main runs repository
# hygiene, the full Rust gate on Linux, macOS, and Windows, the
# declared minimum supported Rust version build and test gate,
# cargo-audit over the committed Cargo.lock, and the Python SDK
# suite on its declared 3.10 floor.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deterministic seed for every simulation and property runner.
  SIM_SEED: "20261112"
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Required files and copy bar
        run: |
          python3 - <<'PY'
          import pathlib, sys
          root = pathlib.Path(".")
          required = [
              "Cargo.toml",
              "Cargo.lock",
              "README.md",
              "CONTRIBUTING.md",
              "CHANGELOG.md",
              "SECURITY.md",
              "DECISIONS.md",
              "docs/ARCHITECTURE.md",
              "docs/INVARIANTS.md",
              "crates/verirun-core/README.md",
              "crates/verirun-platform/README.md",
              "crates/verirun-store/README.md",
              "crates/verirun-cli/README.md",
              "rust-toolchain.toml",
              ".github/workflows/ci.yml",
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              print("missing required files:", missing)
              sys.exit(1)
          # Copy bar: no em dashes or en dashes in Markdown. Verified by codepoint
          # scan, never by a shell pattern that can miss the character.
          bad = []
          for md in root.rglob("*.md"):
              if ".git" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              if chr(0x2014) in text or chr(0x2013) in text:
                  bad.append(str(md))
          if bad:
              print("em dash or en dash found in:", bad)
              sys.exit(1)
          print("hygiene ok")
          PY
      - name: Toolchain pin is present and singular
        run: |
          grep -E '^channel = "[0-9]+\.[0-9]+\.[0-9]+"' rust-toolchain.toml
          test "$(grep -c '^channel' rust-toolchain.toml)" = "1"
      - name: Version parity across all homes
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, tomllib
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          sdk_text = pathlib.Path("python/verirun/__init__.py").read_text(encoding="utf-8")
          sdk_match = re.search(r'^__version__ = "([^"]+)"', sdk_text, re.MULTILINE)
          if sdk_match is None:
              sys.exit("python/verirun/__init__.py carries no __version__ literal")
          if sdk_match.group(1) != expected:
              sys.exit(f"SDK __version__ {sdk_match.group(1)!r} != {expected!r}")
          for manifest in [
              "crates/verirun-platform/Cargo.toml",
              "crates/verirun-core/Cargo.toml",
              "crates/verirun-store/Cargo.toml",
              "crates/verirun-cli/Cargo.toml",
          ]:
              data = tomllib.loads(pathlib.Path(manifest).read_text(encoding="utf-8"))
              ver = data["package"]["version"]
              if ver != expected:
                  sys.exit(f"{manifest} version {ver!r} != {expected!r}")
              for dep_name, dep_spec in data.get("dependencies", {}).items():
                  if dep_name.startswith("verirun-") and isinstance(dep_spec, dict):
                      if dep_spec.get("version") != expected:
                          sys.exit(f"{manifest} dep {dep_name} version {dep_spec.get('version')!r} != {expected!r}")
          print(f"version parity ok at {expected}")
          PY

  rust:
    name: rust
    runs-on: ubuntu-latest
    env:
      # Decision Q6: 1,000 cases per pull request, 10,000 on main.
      PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '1000' || '10000' }}
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Print active seed
        run: echo "SIM_SEED=$SIM_SEED PROPTEST_CASES=$PROPTEST_CASES"
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Run the examples
        run: |
          cargo run --locked -p verirun-core --example canonical_and_digests
          cargo run --locked -p verirun-store --example store_roundtrip
      - name: Bench compile and smoke run
        run: cargo bench --workspace --locked -- --test
      - name: Python SDK test suite
        run: |
          cargo build --locked -p verirun-cli --bin verirun
          python3 -m unittest discover -s python/tests -v

  macos:
    name: macos
    runs-on: macos-latest
    env:
      # Mirrors the cross-platform case-count policy of the windows
      # job: 1,000 cases on pull requests matching the rust job, and
      # 100 on pushes and merge groups while the rust job enforces
      # the 10,000-case main volume.
      PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '1000' || '100' }}
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')" --profile minimal
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Run the examples
        run: |
          cargo run --locked -p verirun-core --example canonical_and_digests
          cargo run --locked -p verirun-store --example store_roundtrip
      - name: Bench compile and smoke run
        run: cargo bench --workspace --locked -- --test
      - name: Python SDK test suite
        run: |
          cargo build --locked -p verirun-cli --bin verirun
          python3 -m unittest discover -s python/tests -v

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      # Roadmap lane R1: the declared rust-version is a promise, so CI
      # builds and tests at exactly that version. RUSTUP_TOOLCHAIN
      # overrides the development pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.88.0"
      # Compatibility is the point of this job, not volume. The rust
      # job owns the case-count policy.
      PROPTEST_CASES: "100"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the declared rust-version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1.88.0-
      - name: Build at the declared rust-version
        run: cargo build --workspace --all-features --locked
      - name: Test at the declared rust-version
        run: cargo test --workspace --all-features --locked --no-fail-fast

  windows:
    name: windows
    runs-on: windows-latest
    env:
      # Perfection slice W7: this job carries the full gate. Pull
      # requests run the same 1,000 cases as the rust job. Pushes
      # and merge groups keep 100, because the full suite at 1,000
      # cases measured 1,251 seconds on this runner in the W7
      # probe and the 10,000 case main policy stays with the
      # rust job.
      PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '1000' || '100' }}
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install "$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')" --profile minimal
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-
      - name: Format
        shell: bash
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Doc
        shell: bash
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Run the examples
        shell: bash
        run: |
          cargo run --locked -p verirun-core --example canonical_and_digests
          cargo run --locked -p verirun-store --example store_roundtrip
      - name: Bench compile and smoke run
        shell: bash
        run: cargo bench --workspace --locked -- --test
      - name: Python SDK test suite
        shell: bash
        run: |
          cargo build --locked -p verirun-cli --bin verirun
          python3 -m unittest discover -s python/tests -v || python -m unittest discover -s python/tests -v

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')" --profile minimal
          rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked
      - name: Audit the dependency set
        # Roadmap lane R7. A vulnerability in the locked
        # dependency set fails this job and therefore the gate.
        run: cargo audit

  python-floor:
    name: python-floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-floor-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-floor-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Python SDK test suite on the declared 3.10 floor
        run: |
          cargo build --locked -p verirun-cli --bin verirun
          python -m unittest discover -s python/tests -v
