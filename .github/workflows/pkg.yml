name: pkg

# Temporary publication support. Packages the three crates with
# cargo package --no-verify and pushes the .crate files to the
# pkg-artifacts branch, where the publishing seat collects them.
# Removed once the 0.1.0 publication is complete.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkg:
    name: pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')" --profile minimal
          rustup show active-toolchain
      - name: Package verirun-core
        run: cargo package -p verirun-core --no-verify
      - name: Package verirun-store
        run: cargo package -p verirun-store --no-verify
      - name: Package verirun-cli
        run: cargo package -p verirun-cli --no-verify
      - name: Push the packages to the pkg-artifacts branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/crates-out
          cp target/package/*.crate /tmp/crates-out/ || true
          ls -la /tmp/crates-out/
          git checkout --orphan pkg-artifacts
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/crates-out/*.crate .
          git add *.crate
          git commit -m "Packaged 0.1.0 crates for publication"
          git push --force origin pkg-artifacts
