name: diag

# Temporary diagnostic workflow, added to find which property
# suite fails at 100,000 cases after the stress workflow's
# first run failed in that step (run 43921605698). It is
# removed again in the change that closes roadmap lane R3.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate package name"
        required: true
        type: string
      test:
        description: "Test target name"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SIM_SEED: "20261112"
  PROPTEST_CASES: "100000"

jobs:
  diag:
    name: One property suite at 100,000 cases
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - name: Run the named property suite
        run: cargo test -p "${{ inputs.crate }}" --test "${{ inputs.test }}" -- --nocapture
