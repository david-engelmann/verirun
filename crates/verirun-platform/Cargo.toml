[package]
name = "verirun-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
description = "The platform seam for verirun. Process group control behind one safe API, a process group on Unix and a job object on Windows."
keywords = ["process", "job-object", "cross-platform", "sandbox"]
categories = ["os"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
