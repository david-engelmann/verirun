[package]
name = "verirun-platform"
version = "0.2.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/verirun-platform"
description = "Cross-platform OS boundary for verirun providing process-tree termination, no-follow handle-relative path traversal, and atomic file replacement on Unix and Windows."
keywords = ["process", "job-object", "cross-platform", "sandbox"]
categories = ["os"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Threading", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[lints]
workspace = true
