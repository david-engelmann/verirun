[package]
name = "verirun-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The verirun executable and its library surface. A thin shell over the deterministic core and the store adapters: run file validation, scheduling, hermetic execution, and manifest verification."
keywords = ["deterministic", "execution", "content-addressed", "manifest", "verification"]
categories = ["command-line-utilities"]

[[bin]]
name = "verirun"
path = "src/main.rs"

[dependencies]
verirun-core = { path = "../verirun-core" }
verirun-store = { path = "../verirun-store" }

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
