[package]
name = "verirun-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
verirun-core = { path = "../crates/verirun-core" }

# Standalone workspace so fuzzing dependencies (`libfuzzer-sys`) stay isolated
# from the shipping workspace dependency graph (`deny.toml` and `Cargo.lock`)
# while still compiling cleanly on stable Rust in CI.
[workspace]
members = ["."]

[[bin]]
name = "canonical_json"
path = "fuzz_targets/canonical_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dag_spec"
path = "fuzz_targets/dag_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false
