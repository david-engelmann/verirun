[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "verirun"
version = "0.2.1"
description = "Content-addressed deterministic task runner CLI and typed Merkle manifest verification SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "David Engelmann" }]
keywords = [
    "deterministic",
    "execution",
    "content-addressed",
    "merkle",
    "manifest",
    "verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/david-engelmann/verirun"
Repository = "https://github.com/david-engelmann/verirun"
Documentation = "https://docs.rs/verirun-core"
Changelog = "https://github.com/david-engelmann/verirun/blob/main/CHANGELOG.md"
Issues = "https://github.com/david-engelmann/verirun/issues"

[tool.maturin]
manifest-path = "crates/verirun-cli/Cargo.toml"
bindings = "bin"
python-source = "python"
module-name = "verirun"
strip = true
include = ["LICENSE-MIT", "LICENSE-APACHE"]
